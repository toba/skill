name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          ASSET="jigo_darwin_arm64.tar.gz"
          SHA=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt -O - \
            | grep "$ASSET" | awk '{print $1}')

          if [ -z "$SHA" ]; then
            echo "ERROR: Could not extract SHA256 for $ASSET"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/toba/homebrew-tap.git" tap
          cd tap

          cat > Formula/jigo.rb << FORMULA
          class Jigo < Formula
            desc "Multi-tool CLI for upstream repo monitoring and Claude Code security guard"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jigo_darwin_arm64.tar.gz"
            version "${VERSION}"
            sha256 "${SHA}"
            license "Apache-2.0"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "jigo"
            end

            test do
              assert_match "jigo", shell_output("#{bin}/jigo version")
            end
          end
          FORMULA

          sed -i 's/^          //' Formula/jigo.rb

          # Drop the pre-rename formula so `brew install toba/tap/jig` stops
          # serving a stale version. --ignore-unmatch keeps this a no-op on
          # every run after the first, when the file is already gone.
          git rm -f --ignore-unmatch Formula/jig.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/jigo.rb
          git commit -m "bump to ${VERSION}"
          git push

  update-scoop:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          CHECKSUMS=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt -O -)

          SHA_AMD64=$(echo "$CHECKSUMS" | grep "jigo_windows_amd64.zip" | awk '{print $1}')
          SHA_ARM64=$(echo "$CHECKSUMS" | grep "jigo_windows_arm64.zip" | awk '{print $1}')

          if [ -z "$SHA_AMD64" ]; then
            echo "ERROR: Could not extract SHA256 for jigo_windows_amd64.zip"
            exit 1
          fi
          if [ -z "$SHA_ARM64" ]; then
            echo "ERROR: Could not extract SHA256 for jigo_windows_arm64.zip"
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/toba/scoop-bucket.git" bucket
          cd bucket

          # $repo carries the real repo path; hardcoding it drifts when the repo
          # is renamed, which is how the formula URL ended up 404ing.
          jq -n \
            --arg version "$VERSION" \
            --arg sha_amd64 "$SHA_AMD64" \
            --arg sha_arm64 "$SHA_ARM64" \
            --arg tag "$TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg desc "Multi-tool CLI for citations, commits, Claude Code guard, and distribution" \
            '{
              version: $version,
              description: $desc,
              homepage: ("https://github.com/" + $repo),
              license: "Apache-2.0",
              architecture: {
                "64bit": {
                  url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/jigo_windows_amd64.zip"),
                  hash: $sha_amd64
                },
                arm64: {
                  url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/jigo_windows_arm64.zip"),
                  hash: $sha_arm64
                }
              },
              bin: ["jigo.exe"],
              checkver: { github: ("https://github.com/" + $repo) },
              autoupdate: {
                architecture: {
                  "64bit": {
                    url: ("https://github.com/" + $repo + "/releases/download/v$version/jigo_windows_amd64.zip")
                  },
                  arm64: {
                    url: ("https://github.com/" + $repo + "/releases/download/v$version/jigo_windows_arm64.zip")
                  }
                }
              }
            }' > jigo.json

          # Drop the pre-rename manifest so `scoop install jig` stops serving a
          # stale version. --ignore-unmatch keeps this a no-op on every run
          # after the first, when the file is already gone.
          git rm -f --ignore-unmatch jig.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jigo.json
          git commit -m "bump jigo to ${VERSION}"
          git push
